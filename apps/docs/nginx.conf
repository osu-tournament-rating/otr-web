# Serves the site Quartz built. Quartz links to pages without their .html
# extension.
server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    error_page 404 /404.html;
    # A folder with no index.html is one that only holds redirect pages for old
    # capitalized URLs, such as /About/. Treat it as not found.
    error_page 403 =404 /404.html;

    # The site is reached through a reverse proxy, so a redirect must not name
    # this container's own address.
    absolute_redirect off;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
