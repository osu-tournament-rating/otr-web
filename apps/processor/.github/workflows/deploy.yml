name: Processor deploy

on:
  workflow_call:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set Docker Tags
        id: set-tag
        run: |
          if [[ ! "${{ github.ref }}" =~ ^refs/tags/[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.[0-9]+)?$ ]]; then
            echo "Production deploys require a release tag, got: ${{ github.ref }}"
            exit 1
          fi
          image_prefix="${{ secrets.DOCKERHUB_USERNAME }}/otr-processor"
          {
            echo 'TAGS<<EOF'
            echo "${image_prefix}:${{ github.ref_name }}"
            echo "${image_prefix}:latest"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.set-tag.outputs.TAGS }}
