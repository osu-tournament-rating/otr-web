name: Deploy

on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string
        description: "Environment to deploy to"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}

    steps:
      - name: Connect to tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ secrets.SSH_HOST }}

      - name: Re-clone repository
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          REMOTE_PATH: ${{ secrets.REMOTE_PATH }}
          REPO_URL: https://github.com/${{ github.repository }}.git
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" bash -s -- "$REMOTE_PATH" "$REPO_URL" <<'EOF'
            set -euo pipefail
            REMOTE_PATH="$1"
            REPO_URL="$2"
            rm -rf "$REMOTE_PATH"
            git clone "$REPO_URL" "$REMOTE_PATH"
          EOF

      - name: Setup Python environment
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          REMOTE_PATH: ${{ secrets.REMOTE_PATH }}
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" bash -s -- "$REMOTE_PATH" <<'EOF'
            set -euo pipefail
            REMOTE_PATH="$1"
            cd "$REMOTE_PATH"
            ~/.local/bin/uv venv --python 3.14
            ~/.local/bin/uv pip install .
          EOF

      - name: Upload deployment assets
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          REMOTE_PATH: ${{ secrets.REMOTE_PATH }}
          ENV_CONTENT: ${{ secrets.ENV }}
        run: |
          set -euo pipefail
          printf '%s\n' "$ENV_CONTENT" > .env

          scp -o StrictHostKeyChecking=no .env "$SSH_USER@$SSH_HOST:$REMOTE_PATH"
