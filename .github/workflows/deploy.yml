name: Deploy

# Every merge to master ships to production once CI passes, then becomes a
# GitHub release that links the merged pull request above its changelog. Running this
# workflow by hand redeploys an existing release, which is how a bad release
# is rolled back.
#
# Images are built while CI runs, under the release tag only. `latest`, which
# production's compose file pulls, moves to them once CI has passed.

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to redeploy, e.g. 2026.10.03'
        required: true
        type: string

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      ref: ${{ steps.resolve.outputs.ref }}
      new: ${{ steps.resolve.outputs.new }}
    steps:
      - name: Resolve tag and source
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ ! "$INPUT_TAG" =~ ^[A-Za-z0-9._-]+$ ]] ||
              ! gh release view "$INPUT_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null; then
              echo "::error::No release is tagged '$INPUT_TAG'." >&2
              exit 1
            fi

            {
              echo "tag=$INPUT_TAG"
              echo "ref=refs/tags/$INPUT_TAG"
              echo "new=false"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The first release of a day is YYYY.MM.DD, later ones add .1, .2, ...
          day="$(date -u +%Y.%m.%d)"
          # Captured first: a failed lookup inside the loop's process
          # substitution went unnoticed and reused an existing tag.
          refs="$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$day" --jq '.[].ref')"
          last=-1
          while read -r ref; do
            name="${ref#refs/tags/}"
            if [[ "$name" == "$day" ]]; then
              if (( last < 0 )); then last=0; fi
            elif [[ "$name" =~ ^${day//./\\.}\.([0-9]+)$ ]]; then
              if (( BASH_REMATCH[1] > last )); then last="${BASH_REMATCH[1]}"; fi
            fi
          done <<< "$refs"

          if (( last < 0 )); then tag="$day"; else tag="$day.$(( last + 1 ))"; fi
          echo "Releasing $SHA as $tag"

          {
            echo "tag=$tag"
            echo "ref=$SHA"
            echo "new=true"
          } >> "$GITHUB_OUTPUT"

  checks:
    name: CI
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml
    with:
      build: false

  build:
    name: Build & push Docker images
    needs: resolve
    if: needs.resolve.outputs.new == 'true'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: stagecodes/otr-web:${{ needs.resolve.outputs.tag }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max,ignore-error=true

      - name: Build and push data worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/data-worker/Dockerfile
          push: true
          tags: stagecodes/otr-data-worker:${{ needs.resolve.outputs.tag }}
          cache-from: type=gha,scope=data-worker
          cache-to: type=gha,scope=data-worker,mode=max,ignore-error=true

  deploy:
    name: Deploy to production
    needs: [resolve, checks, build]
    # A redeploy skips CI and the build; a new release needs both to pass.
    if: >-
      !cancelled() &&
      needs.resolve.result == 'success' &&
      (needs.resolve.outputs.new != 'true' ||
       (needs.checks.result == 'success' && needs.build.result == 'success'))
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.ref }}
          sparse-checkout: |
            docker-compose.yml
            monitoring

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Point latest at the release images
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          for image in stagecodes/otr-web stagecodes/otr-data-worker; do
            docker buildx imagetools create --tag "$image:latest" "$image:$TAG"
          done

      - name: Connect to tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ secrets.SSH_HOST }}

      - name: Ensure remote directory exists
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          REMOTE_PATH: ${{ secrets.REMOTE_PATH }}
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" bash -s -- "$REMOTE_PATH" <<'EOF'
            mkdir -p "$1"
          EOF

      - name: Upload deployment assets
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          REMOTE_PATH: ${{ secrets.REMOTE_PATH }}
          ENV_CONTENT: ${{ secrets.ENV }}
        run: |
          set -euo pipefail
          printf '%s\n' "$ENV_CONTENT" > .env
          scp -o StrictHostKeyChecking=no -r .env docker-compose.yml monitoring \
          "$SSH_USER@$SSH_HOST:$REMOTE_PATH/"

      - name: Deploy stack via docker compose
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          REMOTE_PATH: ${{ secrets.REMOTE_PATH }}
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" bash -s -- "$REMOTE_PATH" <<'EOF'
            cd "$1"
            docker compose pull
            docker compose --profile migrate run --rm migrate && docker compose --profile node-exporter up -d --remove-orphans
          EOF

  release:
    name: Publish release
    needs: [resolve, deploy]
    if: needs.resolve.outputs.new == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.ref }}
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.x

      - name: Write release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ needs.resolve.outputs.ref }}
        run: bun .github/scripts/release-notes.ts render > release-notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          TARGET_SHA: ${{ needs.resolve.outputs.ref }}
        run: |
          gh release create "$TAG" --target "$TARGET_SHA" --title "$TAG" \
            --notes-file release-notes.md --latest
