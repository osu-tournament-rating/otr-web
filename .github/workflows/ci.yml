name: CI

on:
  pull_request:
    branches: [master]
  # deploy.yml runs these checks for every push to master.
  workflow_call:
    inputs:
      build:
        description: 'Also build the apps; the deploy builds them into images instead'
        type: boolean
        default: true
    # A called workflow sees only the secrets its caller passes, so deploy.yml
    # passes these for the Docker Hub sign-ins below. Without them, CI pulls
    # anonymously.
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false

jobs:
  # Decides whether the processor and docs jobs run: only when a file under
  # apps/processor/ or apps/docs/ changed. On a pull request, CI checks out
  # GitHub's trial merge of the pull request into master, so comparing it with
  # master lists exactly what the pull request changes. When deploy.yml runs CI
  # on a push to master, the job compares master before the push with master
  # after it. This uses plain git rather than the dorny/paths-filter action,
  # which would need a token and add a third-party dependency.
  changes:
    runs-on: ubuntu-latest
    outputs:
      processor: ${{ steps.diff.outputs.processor }}
      docs: ${{ steps.diff.outputs.docs }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Also fetches the master commit that a pull request is compared with.
          fetch-depth: 2

      - name: Detect changed paths
        id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base=HEAD^1
          elif [[ -n "$BEFORE" && ! "$BEFORE" =~ ^0+$ ]] &&
            git fetch --quiet --depth=1 origin "$BEFORE"; then
            base="$BEFORE"
          else
            # No commit to compare the push with, so run the processor and
            # docs jobs.
            printf '%s\n' processor=true docs=true | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi

          # --no-renames lists a moved file under its old and new paths, so a
          # file moved out of apps/processor/ still counts. A bumped Quartz
          # submodule is listed as apps/docs/quartz.
          changed="$(git diff --name-only --no-renames "$base" HEAD)"
          processor=false
          if grep -q '^apps/processor/' <<<"$changed"; then processor=true; fi
          docs=false
          if grep -q '^apps/docs/' <<<"$changed"; then docs=true; fi
          printf '%s\n' "processor=$processor" "docs=$docs" | tee -a "$GITHUB_OUTPUT"

  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [test, lint, typecheck, format]
    env:
      # Dummy value needed so build-time imports that require DATABASE_URL do not throw.
      DATABASE_URL: postgresql://dummy:dummy@127.0.0.1:5432/dummy
      SEARCH_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/otr_test
    services:
      postgres:
        image: postgres:17
        # Anonymous pulls count against Docker Hub's per-address limit, which
        # GitHub's runners share, and have failed CI. A service is pulled
        # before any step runs, so it signs in here rather than with
        # docker/login-action. Pull requests from forks get no secrets: when
        # either value is empty, the runner skips the sign-in and pulls
        # anonymously.
        credentials:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: otr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d otr_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.x

      - name: Cache bun install store
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-store-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-store-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache type-check results
        if: matrix.task == 'typecheck'
        uses: actions/cache@v4
        with:
          path: tsconfig.tsbuildinfo
          key: tsc-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: |
            tsc-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
            tsc-${{ runner.os }}-

      - name: Cache lint results
        if: matrix.task == 'lint'
        uses: actions/cache@v4
        with:
          path: |
            apps/web/node_modules/.cache/eslint
            apps/data-worker/node_modules/.cache/eslint
          key: eslint-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: |
            eslint-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
            eslint-${{ runner.os }}-

      - name: Migrate test database
        if: matrix.task == 'test'
        env:
          DATABASE_URL: ${{ env.SEARCH_TEST_DATABASE_URL }}
        run: |
          # 0000 ships commented out
          sed -i -e '1,3d' -e 's/^-- //' apps/web/drizzle/0000_brave_hex.sql
          bunx drizzle-kit migrate

      - name: Run ${{ matrix.task }}
        run: |
          case "${{ matrix.task }}" in
            # bun test skips dot directories
            test) bun test && bun test ./.github/scripts/ ;;
            lint) bun run lint ;;
            typecheck) bunx tsc --noEmit ;;
            format) bunx prettier . --check ;;
          esac

  build:
    # Expressions coerce null to false, so a pull request has no input to test.
    if: github.event_name == 'pull_request' || inputs.build
    runs-on: ubuntu-latest
    env:
      # Dummy value needed so build-time imports that require DATABASE_URL do not throw.
      DATABASE_URL: postgresql://dummy:dummy@127.0.0.1:5432/dummy
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.x

      - name: Cache bun install store
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-store-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-store-${{ runner.os }}-

      - name: Cache Next.js build cache
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ hashFiles('apps/web/**/*.[jt]s', 'apps/web/**/*.[jt]sx') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
            nextjs-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build apps
        run: bun run build

  processor:
    needs: changes
    if: needs.changes.outputs.processor == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [fmt, clippy, test]
    defaults:
      run:
        working-directory: apps/processor
    env:
      # Secrets cannot appear in `if:`, so the Docker Hub sign-in checks this.
      # It is empty on pull requests from forks, which then pull anonymously.
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # rustfmt.toml uses unstable options.
      - name: Set up nightly rustfmt
        if: matrix.task == 'fmt'
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      # The action makes its toolchain the rustup default, which
      # rust-toolchain.toml overrides in this directory, so install the pinned
      # toolchain itself rather than whatever stable is current.
      - name: Read pinned toolchain
        id: toolchain
        if: matrix.task != 'fmt'
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          echo "channel=${channel:?no channel in rust-toolchain.toml}" >> "$GITHUB_OUTPUT"

      - name: Set up Rust
        if: matrix.task != 'fmt'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: ${{ matrix.task == 'clippy' && 'clippy' || '' }}

      - name: Show toolchain
        run: |
          case "${{ matrix.task }}" in
            fmt) cargo +nightly fmt --version ;;
            clippy) cargo --version && cargo clippy --version ;;
            test) cargo --version ;;
          esac

      # Saved only from master, which every pull request can read; see the
      # image build below for why.
      - name: Cache cargo
        if: matrix.task != 'fmt'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/processor
          # Matrix entries share a job id, so keep clippy and test apart.
          key: ${{ matrix.task }}
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/master' }}

      # Testcontainers pulls the tests' PostgreSQL image from Docker Hub with
      # the credentials this writes to ~/.docker/config.json.
      - name: Log in to Docker Hub
        if: matrix.task == 'test' && env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The database tests start PostgreSQL with Testcontainers on the runner's
      # Docker, and set DATABASE_URL themselves.
      - name: Run ${{ matrix.task }}
        run: |
          case "${{ matrix.task }}" in
            fmt) cargo +nightly fmt -- --check ;;
            clippy) cargo clippy --all-targets -- -D warnings ;;
            test) cargo test ;;
          esac

  # Stands in for the processor matrix above when apps/processor is unchanged.
  # Branch protection requires processor (fmt), (clippy), and (test), but a
  # skipped matrix job reports a single check named `processor`, so a pull
  # request that leaves the processor alone would wait on them forever. These
  # report the same names as passing instead, as GitHub advises for required
  # checks that are skipped.
  processor-unchanged:
    name: processor (${{ matrix.task }})
    needs: changes
    if: needs.changes.outputs.processor != 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        task: [fmt, clippy, test]
    steps:
      - name: Skip ${{ matrix.task }}
        run: echo "apps/processor is unchanged, so the processor checks did not run."

  processor-image:
    name: processor (image)
    needs: changes
    # Pull requests only: on master, deploy.yml builds and pushes the image
    # itself when the processor changed since the previous release.
    if: github.event_name == 'pull_request' && needs.changes.outputs.processor == 'true'
    runs-on: ubuntu-latest
    env:
      # Secrets cannot appear in `if:`, so the Docker Hub sign-in checks this.
      # It is empty on pull requests from forks, which then pull anonymously.
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The Dockerfile's base images come from Docker Hub, and so does the
      # BuildKit image that setting up Buildx pulls, so this signs in first.
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Checks the image builds and starts without pushing it. Pull requests
      # read the caches master saves but write none of their own: the
      # repository's 10 GB cache budget was at ~3.7 GB after one pull request.
      # The deploy saves only the final image's layers, because the Dockerfile
      # copies the whole crate before `cargo build --release`, so any source
      # change rebuilds everything and the cache mostly saves the runtime layer.
      - name: Build processor image
        uses: docker/build-push-action@v6
        with:
          context: apps/processor
          file: apps/processor/Dockerfile
          push: false
          load: true
          tags: otr-processor:ci
          cache-from: type=gha,scope=processor

      - name: Smoke test processor image
        run: docker run --rm otr-processor:ci --help

  # The pinned markdownlint-cli2 is the version otr-docs' markdownlint action
  # ran. Run from apps/docs, its .markdownlint-cli2.yaml adds every file under
  # docs/ to the top-level markdown named here.
  docs:
    name: docs (markdownlint)
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/docs
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Lint markdown
        run: npx --yes markdownlint-cli2@0.17.2 '*.md'

  docs-image:
    name: docs (image)
    needs: changes
    # Pull requests only: on master, deploy.yml builds and pushes the image
    # with every release.
    if: github.event_name == 'pull_request' && needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    env:
      # Secrets cannot appear in `if:`, so the Docker Hub sign-in checks this.
      # It is empty on pull requests from forks, which then pull anonymously.
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      # The image copies Quartz from the apps/docs/quartz submodule.
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      # The Dockerfile's base image comes from Docker Hub, and so does the
      # BuildKit image that setting up Buildx pulls, so this signs in first.
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Reads the cache the deploy saves and writes none, as the processor
      # image above explains.
      - name: Build docs image
        uses: docker/build-push-action@v6
        with:
          context: apps/docs
          file: apps/docs/Dockerfile
          push: false
          load: true
          tags: otr-docs:ci
          cache-from: type=gha,scope=docs

      # The image only builds the site when it starts, so a page Quartz cannot
      # render would otherwise pass here and fail in production.
      - name: Build the site in the docs image
        run: docker run --rm otr-docs:ci npx quartz build
